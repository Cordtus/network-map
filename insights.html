<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map Of Nodes — Insights</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<script src="networks.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#eef0f4; --surface:#ffffff; --surface-2:#f5f6f9; --border:#e2e5ec;
    --text:#171a21; --muted:#5f6b7a; --accent:#1f77ff; --accent-2:#7b2ff7;
    --shadow:0 8px 24px rgba(20,30,55,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1119; --surface:#141a26; --surface-2:#1a2130; --border:#252d3f;
      --text:#e6ebf5; --muted:#8b96ad; --accent:#4c9aff; --accent-2:#a06bff;
      --shadow:0 8px 28px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1119; --surface:#141a26; --surface-2:#1a2130; --border:#252d3f;
    --text:#e6ebf5; --muted:#8b96ad; --accent:#4c9aff; --accent-2:#a06bff;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg:#eef0f4; --surface:#ffffff; --surface-2:#f5f6f9; --border:#e2e5ec;
    --text:#171a21; --muted:#5f6b7a; --accent:#1f77ff; --accent-2:#7b2ff7;
    --shadow:0 8px 24px rgba(20,30,55,.12);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  #appbar {
    position:sticky; top:12px; z-index:1200; display:flex; align-items:center; gap:14px;
    margin:12px auto 0; width:min(94vw,760px); padding:8px 12px;
    background:color-mix(in srgb, var(--surface) 86%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    color:var(--text); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow);
  }
  .brand { display:flex; align-items:center; gap:10px; font-weight:650; font-size:15px; letter-spacing:-.01em; white-space:nowrap; }
  .brand .mark { width:26px; height:26px; border-radius:7px; background:var(--accent); color:#fff;
                 display:inline-flex; align-items:center; justify-content:center; }
  .brand .mark svg { width:15px; height:15px; }
  #appbar nav { margin-left:auto; display:flex; align-items:center; gap:8px; }
  #networkSelect {
    height:30px; padding:0 8px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:12px; font-weight:600;
    cursor:pointer; outline:none;
  }
  #networkSelect:hover { border-color:var(--muted); }
  .tabs { display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:9px; }
  .tab { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:7px;
         font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; transition:background .15s,color .15s; }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tab svg { width:14px; height:14px; }
  .btn { display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 13px; border-radius:8px;
         font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; border:1px solid transparent;
         transition:background .15s, border-color .15s, color .15s; white-space:nowrap; }
  .btn svg { width:15px; height:15px; }
  .btn.ghost { color:var(--muted); }
  .btn.ghost:hover { background:var(--surface-2); color:var(--text); }
  .btn.outline { border-color:var(--border); color:var(--text); }
  .btn.outline:hover { background:var(--surface-2); border-color:var(--muted); }
  .btn.icon { padding:0 9px; }

  @media (max-width:760px) {
    #appbar { flex-wrap:wrap; gap:8px; }
    #appbar nav { width:100%; justify-content:flex-end; }
  }

  .stats { display:flex; flex-wrap:wrap; gap:22px 48px; align-items:flex-start; padding:4px 0; }
  .stat { min-width: 96px; }
  .stat .n { font-size:22px; font-weight:700; line-height:1.15; }
  .stat .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .meta-line { font-size:11px; color:var(--muted); margin:-2px 0 8px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:16px; padding:24px 28px 36px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
  .panel h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .panel .chart { position:relative; height:320px; }

  table { border-collapse:collapse; width:100%; font-size:12px; }
  th,td { padding:6px 10px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--surface); color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:.05em; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:10px; font-weight:600; }
  .pill.rpc { background:rgba(31,119,255,.18); color:var(--accent); }
  .pill.peer { background:rgba(46,204,113,.16); color:#16a34a; }
  .table-wrap { overflow:auto; max-height:560px; }
</style>
</head>
<body>
<div id="appbar">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><line x1="12" y1="5" x2="5" y2="19"/><line x1="12" y1="5" x2="19" y2="19"/><line x1="5" y1="19" x2="19" y2="19"/></svg></span>
    Map Of Nodes
  </div>
  <nav>
    <select id="networkSelect" title="Network"></select>
    <div class="tabs">
      <a class="tab" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-6 6-6"/><path d="M15 4l6 6-6 6"/></svg>Map</a>
      <a class="tab active" href="insights.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Insights</a>
    </div>
    <a class="btn outline" id="csvLink" href="#" download="nodes.csv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export CSV</a>
    <button class="btn ghost icon" id="themeToggle" title="Toggle theme"><svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg id="iconSun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </nav>
</div>

<div class="grid">
  <div class="panel overview">
    <h2>Overview</h2>
    <div class="meta-line" id="meta"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="panel"><h2>Top ISPs / hosting providers</h2><div class="chart"><canvas id="isps"></canvas></div></div>
  <div class="panel"><h2>Top countries</h2><div class="chart"><canvas id="countries"></canvas></div></div>
  <div class="panel"><h2>ISP distribution by region (top ISPs)</h2><div class="chart"><canvas id="ispByCountry"></canvas></div></div>
  <div class="panel"><h2>Continents</h2><div class="chart"><canvas id="continents"></canvas></div></div>
  <div class="panel"><h2>WHOIS registrant organizations</h2><div class="chart"><canvas id="whoisOrgs"></canvas></div></div>
  <div class="panel"><h2>Timezone distribution</h2><div class="chart"><canvas id="timezones"></canvas></div></div>
</div>

<div class="grid"><div class="panel" style="grid-column:1/-1">
  <h2>All nodes</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>Host / IP</th><th>Type</th><th>Country</th><th>City</th><th>Timezone</th><th>ISP</th><th>ASN</th><th>WHOIS org</th><th>Reverse DNS</th><th>Hosting</th><th>Moniker</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div></div>

<script>
// ---- theme: default to system, overridable, persisted ----
(function () {
  const stored = localStorage.getItem('map-theme');
  const theme = stored === 'light' || stored === 'dark' ? stored : 'system';
  const moon = document.getElementById('iconMoon'), sun = document.getElementById('iconSun');
  const apply = t => {
    document.documentElement.setAttribute('data-theme', t === 'system' ? '' : t);
    const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    moon.style.display = dark ? 'block' : 'none';
    sun.style.display = dark ? 'none' : 'block';
    localStorage.setItem('map-theme', t);
  };
  apply(theme);
  document.getElementById('themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark'
      : (localStorage.getItem('map-theme') === 'light' ? 'light' : 'system');
    apply(cur === 'system' ? 'light' : cur === 'light' ? 'dark' : 'system');
  });
})();

const net = window.currentNetwork();
window.bindNetworkTabs(net);

// ---- network dropdown: switching navigates to ?network=<slug> ----
const sel = document.getElementById('networkSelect');
window.SUPPORTED_NETWORKS.forEach(n => {
  const o = document.createElement('option');
  o.value = n.slug;
  o.textContent = n.name;
  o.selected = n.slug === net.slug;
  sel.appendChild(o);
});
sel.addEventListener('change', () => { window.setNetwork(sel.value); });
document.getElementById('csvLink').href = `data/${net.slug}/nodes.csv`;

function esc(x) { return String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bar(id, labels, values, color, horizontal) {
  new Chart(document.getElementById(id), {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: color || 'rgba(31,119,255,.75)', borderRadius: 4 }] },
    options: { indexAxis: horizontal ? 'y' : 'x', maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

function render(D) {
  const s = D.stats;
  const defs = [
    ['Total nodes', s.total], ['Countries', s.countries], ['ISPs', s.isps],
    ['WHOIS orgs', s.whoisOrgs],
  ];
  document.getElementById('stats').innerHTML = defs.map(([l, n]) =>
    `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  const name = (window.findNetwork(D.network) || {}).name || D.network;
  const gen = D.generatedAt ? 'generated ' + String(D.generatedAt).slice(0, 10) : '';
  document.getElementById('meta').textContent = [name, gen].filter(Boolean).join(' · ');

  const grid = 'transparent';
  Chart.defaults.color = '#8b96ad';
  Chart.defaults.borderColor = grid;
  Chart.defaults.font.family = 'system-ui, sans-serif';

  bar('isps', D.isps.labels, D.isps.values, 'rgba(31,119,255,.75)', true);
  bar('countries', D.countries.labels, D.countries.values, 'rgba(46,204,113,.7)', true);
  bar('whoisOrgs', D.whoisOrgs.labels, D.whoisOrgs.values, 'rgba(231,76,60,.65)', true);
  bar('timezones', D.timezones.labels, D.timezones.values, 'rgba(241,196,15,.7)', true);

  const palette = ['#1f77ff','#2ecc71','#e74c3c','#f39c12','#7b2ff7','#00bcd4','#e91e63'];
  new Chart(document.getElementById('continents'), {
    type: 'doughnut',
    data: { labels: D.continents.labels, datasets: [{ data: D.continents.values, backgroundColor: palette }] },
    options: { maintainAspectRatio: false }
  });

  new Chart(document.getElementById('ispByCountry'), {
    type: 'bar',
    data: {
      labels: D.ispByCountry.isps,
      datasets: D.ispByCountry.countries.map((c, i) => ({
        label: c, data: D.ispByCountry.isps.map(isp => D.ispByCountry.rows[isp][i]),
        backgroundColor: palette[i % palette.length]
      }))
    },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });

  document.getElementById('tbody').innerHTML = D.table.map(r =>
    `<tr><td>${esc(r.host)}</td>
     <td><span class="pill ${r.type === 'RPC' ? 'rpc' : 'peer'}">${r.type}</span></td>
     <td>${esc(r.country)}</td><td>${esc(r.city)}</td><td>${esc(r.timezone)}</td>
     <td>${esc(r.isp)}</td><td>${esc(r.asn)}</td><td>${esc(r.whois)}</td>
     <td>${esc(r.hostname)}</td><td>${esc(r.hosting)}</td><td>${esc(r.moniker)}</td></tr>`).join('');
}

fetch(`data/${net.slug}/insights.json`)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(render)
  .catch(err => {
    console.error(`Failed to load insights for ${net.slug}:`, err);
    document.getElementById('meta').textContent = `${net.name} — no insights data`;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="n">—</div><div class="l">no data</div></div>';
  });
</script>
</body>
</html>
