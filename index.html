<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Of Nodes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        :root {
            --bg: #eef0f4; --surface: #ffffff; --surface-2: #f5f6f9;
            --border: #e2e5ec; --text: #171a21; --muted: #5f6b7a;
            --accent: #1f77ff; --accent-hover: #1663d6; --accent-2: #7b2ff7;
            --accent-2-hover: #5d1fc4; --good: #1f77ff; --archive: #7b2ff7;
            --peer: #2ecc71; --shadow: 0 8px 24px rgba(20, 30, 55, .12);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d1119; --surface: #141a26; --surface-2: #1a2130;
                --border: #252d3f; --text: #e6ebf5; --muted: #8b96ad;
                --good: #4c9aff; --archive: #a06bff; --peer: #3ee08a;
                --shadow: 0 8px 28px rgba(0, 0, 0, .45);
            }
        }
        :root[data-theme="dark"] {
            --bg: #0d1119; --surface: #141a26; --surface-2: #1a2130;
            --border: #252d3f; --text: #e6ebf5; --muted: #8b96ad;
            --good: #4c9aff; --archive: #a06bff; --peer: #3ee08a;
            --shadow: 0 8px 28px rgba(0, 0, 0, .45);
        }
        :root[data-theme="light"] {
            --bg: #eef0f4; --surface: #ffffff; --surface-2: #f5f6f9;
            --border: #e2e5ec; --text: #171a21; --muted: #5f6b7a;
            --good: #1f77ff; --archive: #7b2ff7; --peer: #2ecc71;
            --shadow: 0 8px 24px rgba(20, 30, 55, .12);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
        #map { width: 100%; height: 100%; }

        #appbar {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 1200; display: flex; align-items: center; gap: 10px;
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); border-radius: 12px;
            box-shadow: var(--shadow); padding: 8px 12px; width: min(92vw, 860px);
        }
        #brand { font-weight: 700; font-size: 15px; letter-spacing: .01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
        #brand svg { width: 20px; height: 20px; }
        #search {
            flex: 1; min-width: 120px; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 8px; background: var(--surface-2); color: var(--text);
            font-size: 13px; outline: none;
        }
        #search:focus { border-color: var(--accent); }
        .counts { display: flex; gap: 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
        .counts .n { font-weight: 600; color: var(--text); }
        .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer;
            font-size: 13px; font-weight: 600; border-radius: 8px; padding: 8px 14px;
            text-decoration: none; transition: background .15s ease, transform .05s ease; white-space: nowrap;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--surface-2); }
        .btn-ghost { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 8px 10px; }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
        .btn svg { width: 15px; height: 15px; }

        #legend {
            position: absolute; bottom: 24px; left: 12px; z-index: 1000;
            background: var(--surface); color: var(--text); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 12px; line-height: 1.8;
        }
        #legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        #legend input { accent-color: var(--accent); }
        #status {
            position: absolute; bottom: 24px; right: 12px; z-index: 1000;
            background: var(--surface); color: var(--muted); border: 1px solid var(--border);
            border-radius: 10px; padding: 6px 10px; font-size: 11px; box-shadow: var(--shadow);
        }
        .node-marker { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
        .m-good { background: var(--good); }
        .m-archive { background: var(--archive); }
        .m-peer { background: var(--peer); }
        .leaflet-popup-content { font-size: 12px; line-height: 1.5; color: #222; }
        .leaflet-popup-content h4 { margin: 0 0 4px; font-size: 13px; }
        .leaflet-popup-content .meta { color: #555; }
        .leaflet-popup-content a { color: var(--good); }
        .leaflet-container { background: var(--bg); }
        @media (max-width: 760px) {
            #appbar { flex-wrap: wrap; }
            .counts { order: 3; width: 100%; justify-content: space-between; }
            #search { order: 2; flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="appbar">
        <div id="brand">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="16" y1="9" x2="9" y2="21"/><line x1="16" y1="9" x2="23" y2="21"/><line x1="9" y1="21" x2="23" y2="21"/></g><circle cx="16" cy="9" r="3.2" fill="#fff"/><circle cx="9" cy="21" r="3.2" fill="#fff"/><circle cx="23" cy="21" r="3.2" fill="#fff"/></svg>
            Map Of Nodes
        </div>
        <input id="search" type="text" placeholder="Filter by host, moniker, city, ISP, chain..." />
        <span class="counts" id="counts"></span>
        <a class="btn btn-secondary" href="nodes.csv" download="nodes.csv" title="Download node data as CSV">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
        </a>
        <a class="btn btn-primary" href="insights.html" title="ISP, WHOIS and regional analysis">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Insights
        </a>
        <button id="themeToggle" class="btn btn-ghost" title="Toggle theme" aria-label="Toggle theme">
            <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
    </div>

    <div id="legend"></div>
    <div id="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="geolocations.js"></script>
    <script>
        // ---- theme: default to system, overridable, persisted ----
        (function () {
            const stored = localStorage.getItem('map-theme');
            const theme = stored === 'light' || stored === 'dark' ? stored : 'system';
            document.documentElement.setAttribute('data-theme', theme === 'system' ? '' : theme);
            const moon = document.getElementById('iconMoon'), sun = document.getElementById('iconSun');
            const apply = t => {
                document.documentElement.setAttribute('data-theme', t === 'system' ? '' : t);
                const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                moon.style.display = dark ? 'block' : 'none';
                sun.style.display = dark ? 'none' : 'block';
                localStorage.setItem('map-theme', t);
            };
            apply(theme);
            document.getElementById('themeToggle').addEventListener('click', () => {
                const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark'
                    : (localStorage.getItem('map-theme') === 'light' ? 'light' : 'system');
                apply(cur === 'system' ? 'light' : cur === 'light' ? 'dark' : 'system');
                window.__onThemeChange && window.__onThemeChange();
            });
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if ((localStorage.getItem('map-theme') || 'system') === 'system') {
                    window.__onThemeChange && window.__onThemeChange();
                }
            });
        })();

        const data = window.networkData || { good: [], peers: [], counts: {} };
        const state = { good: true, peers: true, archive: true };
        let activeMarkers = [];

        const icons = {
            good: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6],
                html: '<div class="node-marker m-good" style="width:12px;height:12px"></div>' }),
            archive: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6],
                html: '<div class="node-marker m-archive" style="width:12px;height:12px"></div>' }),
            peer: L.divIcon({ className: '', iconSize: [10, 10], iconAnchor: [5, 5],
                html: '<div class="node-marker m-peer" style="width:10px;height:10px"></div>' }),
        };

        const map = L.map('map');

        // Dark (night-view) vs light basemap; swap live with the theme.
        const darkTiles = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        const lightTiles = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        let tileLayer = null;
        const isDark = () => {
            const t = document.documentElement.getAttribute('data-theme');
            if (t === 'dark') return true;
            if (t === 'light') return false;
            return matchMedia('(prefers-color-scheme: dark)').matches;
        };
        const applyTiles = () => {
            if (tileLayer) map.removeLayer(tileLayer);
            tileLayer = L.tileLayer(isDark() ? darkTiles : lightTiles, {
                maxZoom: 18,
                attribution: isDark()
                    ? '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/">CARTO</a>'
                    : '&copy; OpenStreetMap contributors',
            });
            tileLayer.addTo(map);
        };
        window.__onThemeChange = applyTiles;
        applyTiles();

        const layers = {
            good: L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 }),
            peers: L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 }),
        };
        map.addLayer(layers.good);
        map.addLayer(layers.peers);

        function popupHtml(geo) {
            const meta = [];
            if (geo.moniker) meta.push(`<b>${escapeHtml(geo.moniker)}</b>`);
            if (geo.chain) meta.push(`chain: ${escapeHtml(geo.chain)}`);
            if (geo.archive) meta.push('archive node');
            if (geo.host) meta.push(`host: <code>${escapeHtml(geo.host)}</code>`);
            if (geo.ip) meta.push(`ip: <code>${escapeHtml(geo.ip)}</code>`);
            if (geo.org) meta.push(`host/ISP: <code>${escapeHtml(geo.org)}</code>`);
            if (geo.hostname) meta.push(`reverse DNS: <code>${escapeHtml(geo.hostname)}</code>`);
            if (geo.timezone) meta.push(`timezone: <code>${escapeHtml(geo.timezone)}</code>`);
            if (geo.hosting !== undefined && geo.hosting !== null) meta.push(`hosting: ${geo.hosting ? 'yes' : 'no'}`);
            const whois = geo.whois || {};
            if (whois.org) meta.push(`whois: <code>${escapeHtml(whois.org)}</code>`);
            else if (whois.netname) meta.push(`whois: <code>${escapeHtml(whois.netname)}</code>`);
            if (whois.cidr) meta.push(`block: <code>${escapeHtml(whois.cidr)}</code>`);
            if (whois.abuse) meta.push(`abuse: <a href="mailto:${escapeHtml(whois.abuse)}">${escapeHtml(whois.abuse)}</a>`);
            const loc = [geo.city, geo.region, geo.country].filter(Boolean).join(', ');
            if (loc) meta.push(loc);
            if (geo.rpc) meta.push(`rpc: <a href="${geo.rpc}" target="_blank">${escapeHtml(geo.rpc)}</a>`);
            if (geo.rest) meta.push(`rest: <a href="${geo.rest}" target="_blank">${escapeHtml(geo.rest)}</a>`);
            return `<div><h4>${escapeHtml(geo.host || geo.ip || '')}</h4><div class="meta">${meta.join('<br>')}</div></div>`;
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function addMarker(geo, layer, icon) {
            if (!geo.latitude || !geo.longitude) return;
            const marker = L.marker([geo.latitude, geo.longitude], { icon });
            marker.bindPopup(popupHtml(geo));
            marker.geo = geo;
            layer.addLayer(marker);
            activeMarkers.push(marker);
        }

        function build() {
            layers.good.clearLayers();
            layers.peers.clearLayers();
            activeMarkers = [];
            for (const geo of data.good || []) {
                if (geo.archive && !state.archive) continue;
                addMarker(geo, layers.good, geo.archive ? icons.archive : icons.good);
            }
            for (const geo of data.peers || []) addMarker(geo, layers.peers, icons.peer);
            renderCounts();
        }

        function renderCounts() {
            const c = data.counts || {};
            const n = v => v ?? 0;
            document.getElementById('counts').innerHTML =
                `<span><span class="dot" style="background:var(--good)"></span>RPC <span class="n">${n(c.good)}</span></span>` +
                `<span><span class="dot" style="background:var(--peer)"></span>Peers <span class="n">${n(c.peers)}</span></span>`;
        }

        function buildLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = `
                <label><input type="checkbox" id="tg-good" checked> <span class="dot" style="background:var(--good)"></span>RPC nodes</label>
                <label><input type="checkbox" id="tg-archive" checked> <span class="dot" style="background:var(--archive)"></span>Archive nodes</label>
                <label><input type="checkbox" id="tg-peers" checked> <span class="dot" style="background:var(--peer)"></span>Peer nodes (no RPC)</label>`;
            document.getElementById('tg-good').addEventListener('change', e => {
                state.good = e.target.checked; toggleLayer('good', e.target.checked);
            });
            document.getElementById('tg-archive').addEventListener('change', e => {
                state.archive = e.target.checked; rebuild();
            });
            document.getElementById('tg-peers').addEventListener('change', e => {
                state.peers = e.target.checked; toggleLayer('peers', e.target.checked);
            });
        }

        function toggleLayer(name, on) {
            if (on && !map.hasLayer(layers[name])) map.addLayer(layers[name]);
            if (!on && map.hasLayer(layers[name])) map.removeLayer(layers[name]);
        }

        function rebuild() {
            layers.good.clearLayers();
            for (const geo of data.good || []) {
                if (geo.archive && !state.archive) continue;
                addMarker(geo, layers.good, geo.archive ? icons.archive : icons.good);
            }
            renderCounts();
        }

        function applyFilter(q) {
            q = q.trim().toLowerCase();
            activeMarkers.forEach(m => m.setOpacity(1));
            if (!q) return;
            let visible = 0;
            activeMarkers.forEach(m => {
                const geo = m.geo || {};
                const hay = [geo.host, geo.ip, geo.moniker, geo.city, geo.region, geo.country, geo.chain, geo.org,
                    geo.hostname, geo.timezone, (geo.whois || {}).org, (geo.whois || {}).netname]
                    .filter(Boolean).join(' ').toLowerCase();
                const match = hay.includes(q);
                m.setOpacity(match ? 1 : 0.15);
                if (match) visible++;
            });
            document.getElementById('status').textContent = `${visible} matching`;
        }

        document.getElementById('search').addEventListener('input', e => applyFilter(e.target.value));

        buildLegend();
        build();
        const all = activeMarkers;
        if (all.length) map.fitBounds(L.latLngBounds(all.map(m => m.getLatLng())).pad(0.15));
        else map.setView([20, 0], 2);
        document.getElementById('status').textContent =
            `generated ${data.generatedAt || '?'}${data.chainId ? ' · ' + data.chainId : ''}`;
    </script>
</body>
</html>
