<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Of Nodes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="config.js"></script>
    <script src="networks.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        :root {
            --bg: #eef0f4; --surface: #ffffff; --surface-2: #f5f6f9;
            --border: #e2e5ec; --text: #171a21; --muted: #5f6b7a;
            --accent: #1f77ff; --accent-hover: #1663d6; --accent-2: #7b2ff7;
            --accent-2-hover: #5d1fc4; --good: #1f77ff; --archive: #7b2ff7;
            --peer: #2ecc71; --shadow: 0 8px 24px rgba(20, 30, 55, .12);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d1119; --surface: #141a26; --surface-2: #1a2130;
                --border: #252d3f; --text: #e6ebf5; --muted: #8b96ad;
                --good: #4c9aff; --archive: #a06bff; --peer: #3ee08a;
                --shadow: 0 8px 28px rgba(0, 0, 0, .45);
            }
        }
        :root[data-theme="dark"] {
            --bg: #0d1119; --surface: #141a26; --surface-2: #1a2130;
            --border: #252d3f; --text: #e6ebf5; --muted: #8b96ad;
            --good: #4c9aff; --archive: #a06bff; --peer: #3ee08a;
            --shadow: 0 8px 28px rgba(0, 0, 0, .45);
        }
        :root[data-theme="light"] {
            --bg: #eef0f4; --surface: #ffffff; --surface-2: #f5f6f9;
            --border: #e2e5ec; --text: #171a21; --muted: #5f6b7a;
            --good: #1f77ff; --archive: #7b2ff7; --peer: #2ecc71;
            --shadow: 0 8px 24px rgba(20, 30, 55, .12);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
        #map { width: 100%; height: 100%; }

        #appbar {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 1200; display: flex; align-items: center; gap: 14px;
            background: color-mix(in srgb, var(--surface) 86%, transparent);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            color: var(--text); border: 1px solid var(--border); border-radius: 12px;
            box-shadow: var(--shadow); padding: 8px 12px; width: min(94vw, 760px);
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
        .brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
        .brand .mark svg { width: 15px; height: 15px; }
        #appbar nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
        .tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; transition: background .15s, color .15s; }
        .tab:hover { color: var(--text); }
        .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        .tab svg { width: 14px; height: 14px; }
        .btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
        .btn svg { width: 15px; height: 15px; }
        .btn.outline { border-color: var(--border); color: var(--text); }
        .btn.outline:hover { background: var(--surface-2); border-color: var(--muted); }
        .btn.ghost { color: var(--muted); }
        .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
        .btn.icon { padding: 0 9px; }
        #networkSelect {
            height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface-2); color: var(--text); font-size: 12px; font-weight: 600;
            cursor: pointer; outline: none;
        }
        #networkSelect:hover { border-color: var(--muted); }

        /* Map controls sit below the floating app bar */
        .leaflet-top.leaflet-left { top: 68px; }
        #search {
            position: absolute; top: 68px; right: 12px; z-index: 1200;
            width: min(320px, 70vw); padding: 9px 13px; border: 1px solid var(--border);
            border-radius: 10px; background: color-mix(in srgb, var(--surface) 90%, transparent);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            color: var(--text); font-size: 13px; box-shadow: var(--shadow); outline: none;
        }
        #search:focus { border-color: var(--accent); }
        .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

        #status {
            position: absolute; bottom: 24px; right: 12px; z-index: 1000;
            background: var(--surface); color: var(--muted); border: 1px solid var(--border);
            border-radius: 10px; padding: 6px 10px; font-size: 11px; box-shadow: var(--shadow);
        }
        .node-marker { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
        .m-good { background: var(--good); }
        .m-archive { background: var(--archive); }
        .m-peer { background: var(--peer); }
        .leaflet-popup-content { font-size: 12px; line-height: 1.5; color: #222; }
        .leaflet-popup-content h4 { margin: 0 0 4px; font-size: 13px; }
        .leaflet-popup-content .meta { color: #555; }
        .leaflet-popup-content a { color: var(--good); }
        .leaflet-container { background: var(--bg); }
        /* Night-view basemap: darken the standard OSM tiles in dark mode */
        .map-dark .leaflet-tile {
            filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9);
        }
        @media (max-width: 760px) {
            #appbar { flex-wrap: wrap; gap: 8px; }
            #appbar nav { width: 100%; justify-content: flex-end; }
            .leaflet-top.leaflet-left { top: 118px; }
            #search { top: 168px; left: 12px; right: 12px; width: auto; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="appbar">
        <div class="brand">
            <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><line x1="12" y1="5" x2="5" y2="19"/><line x1="12" y1="5" x2="19" y2="19"/><line x1="5" y1="19" x2="19" y2="19"/></svg></span>
            Map Of Nodes
        </div>
        <nav>
            <select id="networkSelect" title="Network"></select>
            <div class="tabs">
                <a class="tab active" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-6 6-6"/><path d="M15 4l6 6-6 6"/></svg>Map</a>
                <a class="tab" href="insights.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Insights</a>
            </div>
            <a class="btn outline" id="csvLink" href="#" download="nodes.csv" title="Download node data as CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export CSV</a>
            <button class="btn ghost icon" id="themeToggle" title="Toggle theme"><svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg id="iconSun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
        </nav>
    </div>

    <input id="search" type="text" placeholder="Filter by host, moniker, city, ISP..." />

    <div id="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        // ---- theme: default to system, overridable, persisted ----
        (function () {
            const stored = localStorage.getItem('map-theme');
            const theme = stored === 'light' || stored === 'dark' ? stored : 'system';
            document.documentElement.setAttribute('data-theme', theme === 'system' ? '' : theme);
            const moon = document.getElementById('iconMoon'), sun = document.getElementById('iconSun');
            const apply = t => {
                document.documentElement.setAttribute('data-theme', t === 'system' ? '' : t);
                const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                moon.style.display = dark ? 'block' : 'none';
                sun.style.display = dark ? 'none' : 'block';
                localStorage.setItem('map-theme', t);
            };
            apply(theme);
            document.getElementById('themeToggle').addEventListener('click', () => {
                const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark'
                    : (localStorage.getItem('map-theme') === 'light' ? 'light' : 'system');
                apply(cur === 'system' ? 'light' : cur === 'light' ? 'dark' : 'system');
                window.__onThemeChange && window.__onThemeChange();
            });
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if ((localStorage.getItem('map-theme') || 'system') === 'system') {
                    window.__onThemeChange && window.__onThemeChange();
                }
            });
        })();

        const net = window.currentNetwork();
        window.bindNetworkTabs(net);

        // ---- network dropdown: switching navigates to ?network=<slug> ----
        const sel = document.getElementById('networkSelect');
        window.SUPPORTED_NETWORKS.forEach(n => {
            const o = document.createElement('option');
            o.value = n.slug;
            o.textContent = n.name;
            o.selected = n.slug === net.slug;
            sel.appendChild(o);
        });
        sel.addEventListener('change', () => { window.setNetwork(sel.value); });
        document.getElementById('csvLink').href = `data/${net.slug}/nodes.csv`;

        function init() {
        const data = window.networkData || { good: [], peers: [], counts: {} };
        let activeMarkers = [];

        const icons = {
            good: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6],
                html: '<div class="node-marker m-good" style="width:12px;height:12px"></div>' }),
            archive: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6],
                html: '<div class="node-marker m-archive" style="width:12px;height:12px"></div>' }),
            peer: L.divIcon({ className: '', iconSize: [10, 10], iconAnchor: [5, 5],
                html: '<div class="node-marker m-peer" style="width:10px;height:10px"></div>' }),
        };

        const map = L.map('map');

        const isDark = () => {
            const t = document.documentElement.getAttribute('data-theme');
            if (t === 'dark') return true;
            if (t === 'light') return false;
            return matchMedia('(prefers-color-scheme: dark)').matches;
        };

        // CARTO basemaps when an API key is configured (see config.js); otherwise
        // keyless OSM tiles with a CSS night-view filter in dark mode.
        const cartoKey = (window.BASEMAP_KEY || '').trim();
        const cartoURL = (style, key) =>
            `https://basemaps.cartocdn.com/rastertiles/${style}/{z}/{x}/{y}{r}.png?key=${key}`;
        const LIGHT_TILES = cartoKey
            ? cartoURL('voyager', cartoKey)
            : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        const DARK_TILES = cartoKey ? cartoURL('dark_all', cartoKey) : LIGHT_TILES;
        const attribution = cartoKey
            ? '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            : '&copy; OpenStreetMap contributors';

        let tileLayer = null;
        const applyMapTheme = () => {
            const dark = isDark();
            if (tileLayer) map.removeLayer(tileLayer);
            tileLayer = L.tileLayer(dark ? DARK_TILES : LIGHT_TILES, {
                maxZoom: cartoKey ? 19 : 18,
                attribution,
            });
            tileLayer.addTo(map);
            map.getContainer().classList.toggle('map-dark', dark && !cartoKey);
        };
        window.__onThemeChange = applyMapTheme;
        applyMapTheme();

        const layers = {
            good: L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 }),
            peers: L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 }),
        };
        map.addLayer(layers.good);
        map.addLayer(layers.peers);

        function popupHtml(geo) {
            const meta = [];
            if (geo.moniker) meta.push(`<b>${escapeHtml(geo.moniker)}</b>`);
            if (geo.chain) meta.push(`chain: ${escapeHtml(geo.chain)}`);
            if (geo.archive) meta.push('archive node');
            if (geo.host) meta.push(`host: <code>${escapeHtml(geo.host)}</code>`);
            if (geo.ip) meta.push(`ip: <code>${escapeHtml(geo.ip)}</code>`);
            if (geo.org) meta.push(`host/ISP: <code>${escapeHtml(geo.org)}</code>`);
            if (geo.hostname) meta.push(`reverse DNS: <code>${escapeHtml(geo.hostname)}</code>`);
            if (geo.timezone) meta.push(`timezone: <code>${escapeHtml(geo.timezone)}</code>`);
            if (geo.hosting !== undefined && geo.hosting !== null) meta.push(`hosting: ${geo.hosting ? 'yes' : 'no'}`);
            const whois = geo.whois || {};
            if (whois.org) meta.push(`whois: <code>${escapeHtml(whois.org)}</code>`);
            else if (whois.netname) meta.push(`whois: <code>${escapeHtml(whois.netname)}</code>`);
            if (whois.cidr) meta.push(`block: <code>${escapeHtml(whois.cidr)}</code>`);
            if (whois.abuse) meta.push(`abuse: <a href="mailto:${escapeHtml(whois.abuse)}">${escapeHtml(whois.abuse)}</a>`);
            const loc = [geo.city, geo.region, geo.country].filter(Boolean).join(', ');
            if (loc) meta.push(loc);
            if (geo.rpc) meta.push(`rpc: <a href="${geo.rpc}" target="_blank">${escapeHtml(geo.rpc)}</a>`);
            if (geo.rest) meta.push(`rest: <a href="${geo.rest}" target="_blank">${escapeHtml(geo.rest)}</a>`);
            return `<div><h4>${escapeHtml(geo.host || geo.ip || '')}</h4><div class="meta">${meta.join('<br>')}</div></div>`;
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function addMarker(geo, layer, icon) {
            if (!geo.latitude || !geo.longitude) return;
            const marker = L.marker([geo.latitude, geo.longitude], { icon });
            marker.bindPopup(popupHtml(geo));
            marker.geo = geo;
            layer.addLayer(marker);
            activeMarkers.push(marker);
        }

        function build() {
            layers.good.clearLayers();
            layers.peers.clearLayers();
            activeMarkers = [];
            for (const geo of data.good || []) addMarker(geo, layers.good, geo.archive ? icons.archive : icons.good);
            for (const geo of data.peers || []) addMarker(geo, layers.peers, icons.peer);
        }

        function applyFilter(q) {
            q = q.trim().toLowerCase();
            activeMarkers.forEach(m => m.setOpacity(1));
            if (!q) return;
            let visible = 0;
            activeMarkers.forEach(m => {
                const geo = m.geo || {};
                const hay = [geo.host, geo.ip, geo.moniker, geo.city, geo.region, geo.country, geo.chain, geo.org,
                    geo.hostname, geo.timezone, (geo.whois || {}).org, (geo.whois || {}).netname]
                    .filter(Boolean).join(' ').toLowerCase();
                const match = hay.includes(q);
                m.setOpacity(match ? 1 : 0.15);
                if (match) visible++;
            });
            document.getElementById('status').textContent = `${visible} matching`;
        }

        document.getElementById('search').addEventListener('input', e => applyFilter(e.target.value));

        build();
        const all = activeMarkers;
        if (all.length) map.fitBounds(L.latLngBounds(all.map(m => m.getLatLng())).pad(0.15));
        else map.setView([20, 0], 2);
        document.getElementById('status').textContent =
            `generated ${data.generatedAt || '?'}${data.chainId ? ' · ' + data.chainId : ''}`;
        }

        const dataScript = document.createElement('script');
        dataScript.src = `data/${net.slug}/geolocations.js`;
        dataScript.onload = init;
        dataScript.onerror = () => {
            document.getElementById('status').textContent = `no data for ${net.name}`;
        };
        document.head.appendChild(dataScript);
    </script>
</body>
</html>
